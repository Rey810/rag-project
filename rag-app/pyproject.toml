[project]
name = "rag-app"
version = "0.1.0"
description = ""
authors = [
    {name = "reyvdb",email = "reyvdb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests (>=2.33.0,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "langchain-text-splitters (>=1.1.1,<2.0.0)",
    "uuid (>=1.30,<2.0)",
    "pinecone (>=8.1.0,<9.0.0)",
    "openai (>=2.30.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "docling (>=2.84.0,<3.0.0)",
    "arize-otel (>=0.2.0)",
    "openinference-instrumentation-openai (>=0.1.0)",
    "datetime (>=6.0,<7.0)"
]

[tool.poetry]
packages = [{include = "rag_app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
